# Compila el instalador y el ZIP de Windows.
#
# Existe porque PyInstaller no cross-compila: el `.exe` sólo sale ejecutando el
# empaquetado *en* Windows. Aquí ese Windows lo pone GitHub, así que se puede
# publicar una build sin tener que reiniciar el equipo en la otra partición.
#
# Se lanza a mano (Actions → Windows → Run workflow) o publicando una etiqueta
# `v*`, que además crea la release con los ficheros adjuntos.

name: Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Instalador y ZIP
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 3.13 y no 3.14: pythonnet, el puente con .NET que pywebview usa en
      # Windows, no soporta todavía la 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Inno Setup no viene en la imagen de forma fiable —hay peticiones abiertas
      # para añadirlo—, así que se instala en vez de darlo por hecho.
      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Construir payload, instalador y ZIP
        shell: pwsh
        run: ./build.ps1 payload installer zip

      # Se separa de la construcción a propósito: así el registro distingue
      # "no compila" de "compila pero no arranca", que son dos problemas muy
      # distintos y se arreglan en sitios distintos.
      - name: Comprobar el entorno sobre el payload
        shell: pwsh
        run: ./build.ps1 check

      # Esta ejecución es el primer contacto del porte con un Windows de verdad,
      # así que si la comprobación falla se sube igualmente lo que se haya
      # construido: un fallo sin artefacto obliga a una segunda ronda a ciegas.
      # `if-no-files-found: ignore` porque puede fallar antes de que exista nada.
      - name: Guardar el diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stella-client-diagnostics
          path: |
            dist/packages/*
            dist/app/stella-client/**
          if-no-files-found: ignore

      # Este sí es el entregable: si la comprobación no ha pasado, el job ya ha
      # fallado y este paso no llega a ejecutarse.
      - uses: actions/upload-artifact@v4
        with:
          name: stella-client-windows
          path: dist/packages/*
          if-no-files-found: error

  # Con una etiqueta `v*`, los mismos ficheros se adjuntan a una release.
  release:
    name: Publicar la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Adjuntar los ficheros a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Stella Client $GITHUB_REF_NAME" --generate-notes
